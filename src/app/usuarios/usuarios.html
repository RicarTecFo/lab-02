<h2>Usuarios</h2>

<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>Usuario</th>
      <th>Email</th>
      <th>Rol</th>
    </tr>
  </thead>

  <tbody>
    @for(user of users; track user.id){

      <tr>
        <td>{{ user.id }}</td>
        <td>{{ user.username }}</td>
        <td>{{ user.email }}</td>
        <td>{{ user.role }}</td>
      </tr>

    }
  </tbody>
</table>
